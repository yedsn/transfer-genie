name: Verify release bundles

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/verify-release-bundles.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'package-lock.json'
      - 'package.json'
      - 'scripts/prepare_ffmpeg_sidecar.ps1'
      - 'scripts/verify_ffmpeg_bundle.ps1'
      - 'scripts/verify_ffmpeg_manifest.ps1'
      - 'scripts/verify_release_bundle.ps1'
      - 'src/**'
      - 'src-ui/**'
      - 'tauri.conf.json'
      - 'tools/ffmpeg/**'
  pull_request:
    paths:
      - '.github/workflows/verify-release-bundles.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'package-lock.json'
      - 'package.json'
      - 'scripts/prepare_ffmpeg_sidecar.ps1'
      - 'scripts/verify_ffmpeg_bundle.ps1'
      - 'scripts/verify_ffmpeg_manifest.ps1'
      - 'scripts/verify_release_bundle.ps1'
      - 'src/**'
      - 'src-ui/**'
      - 'tauri.conf.json'
      - 'tools/ffmpeg/**'

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.name }} bundle
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
            ffmpeg_target: macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
            ffmpeg_target: macos-x64
          - name: Windows x64
            os: windows-latest
            rust_target: ''
            args: --bundles nsis
            ffmpeg_target: windows-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install extra Rust target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify and prepare pinned FFmpeg
        shell: pwsh
        run: |
          ./scripts/verify_ffmpeg_manifest.ps1 -CheckRemoteMetadata
          ./scripts/prepare_ffmpeg_sidecar.ps1 -Target ${{ matrix.ffmpeg_target }}
          ./scripts/verify_ffmpeg_bundle.ps1

      - name: Build native bundles without updater artifacts
        shell: pwsh
        run: npx tauri build ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Verify Windows release bundle contents
        if: ${{ !startsWith(matrix.os, 'macos') }}
        shell: pwsh
        run: ./scripts/verify_release_bundle.ps1 -Target ${{ matrix.ffmpeg_target }}

      - name: Verify and launch macOS release bundle
        if: ${{ startsWith(matrix.os, 'macos') }}
        shell: pwsh
        run: ./scripts/verify_release_bundle.ps1 -Target ${{ matrix.ffmpeg_target }} -LaunchMacApp

      - name: Upload verification report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-${{ matrix.ffmpeg_target }}
          path: target/release-verification/${{ matrix.ffmpeg_target }}.json
          if-no-files-found: error
