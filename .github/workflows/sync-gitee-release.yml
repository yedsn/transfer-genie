name: Sync Latest Release to Gitee

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional Git tag to sync, for example v0.1.4. Leave empty to use the latest GitHub release."
        required: false
        type: string

jobs:
  sync-gitee:
    name: Sync release assets to Gitee
    runs-on: [self-hosted]
    env:
      PYTHONUNBUFFERED: "1"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
      GITEE_SYNC_PROXY: ${{ vars.GITEE_SYNC_PROXY }}
      GITEE_SYNC_USE_ARIA2: ${{ vars.GITEE_SYNC_USE_ARIA2 }}

    steps:
      - name: Configure proxy for GitHub access
        shell: bash
        run: |
          no_proxy_hosts="gitee.com,.gitee.com,localhost,127.0.0.1"
          echo "NO_PROXY=$no_proxy_hosts" >> "$GITHUB_ENV"
          echo "no_proxy=$no_proxy_hosts" >> "$GITHUB_ENV"
          if [ -n "$GITEE_SYNC_PROXY" ]; then
            {
              echo "HTTP_PROXY=$GITEE_SYNC_PROXY"
              echo "HTTPS_PROXY=$GITEE_SYNC_PROXY"
              echo "http_proxy=$GITEE_SYNC_PROXY"
              echo "https_proxy=$GITEE_SYNC_PROXY"
            } >> "$GITHUB_ENV"
          fi
          echo "GitHub downloads use GITEE_SYNC_PROXY; Gitee remains direct via NO_PROXY."

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate Gitee token
        if: ${{ env.GITEE_ACCESS_TOKEN == '' }}
        run: |
          echo "::error::Missing repository secret GITEE_ACCESS_TOKEN"
          exit 1

      - name: Check selected download tool
        shell: bash
        run: |
          if [ "${GITEE_SYNC_USE_ARIA2,,}" = "true" ]; then
            if ! command -v aria2c >/dev/null 2>&1; then
              echo "::error::GITEE_SYNC_USE_ARIA2=true, but aria2c is not available."
              exit 1
            fi
            aria2c --version
          else
            if ! command -v curl >/dev/null 2>&1; then
              echo "::error::curl is required when GITEE_SYNC_USE_ARIA2 is not true."
              exit 1
            fi
            curl --version
          fi

      - name: Sync latest GitHub release to Gitee
        if: ${{ env.GITEE_ACCESS_TOKEN != '' && github.event.inputs.tag == '' }}
        run: python3 scripts/release/release_sync_gitee.py

      - name: Sync specified GitHub release tag to Gitee
        if: ${{ env.GITEE_ACCESS_TOKEN != '' && github.event.inputs.tag != '' }}
        run: python3 scripts/release/release_sync_gitee.py --tag "${{ github.event.inputs.tag }}"
