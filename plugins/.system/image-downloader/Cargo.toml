[package]
name = "transfer-genie-image-bot"
version = "1.0.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "rustls-tls"] }
url = "2.5"
image = "0.24"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt", "time", "net"] }
